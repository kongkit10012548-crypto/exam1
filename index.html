<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ห้องสอบ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* ธีม: แดชบอร์ดการเรียนรู้โทนเขียวพาสเทล การ์ดมุมโค้ง เงานุ่ม */
:root{
  --paper:#F4F8F5; --ink:#14281C; --muted:#5E6F66; --rule:#E2EBE5; --rule-2:#C9D8CF;
  --accent:#16A05A; --accent-d:#0E7C45; --accent-ink:#FFFFFF; --accent-soft:#E4F4EA; --accent-fg:#0E7C45;
  --ok:#16A05A; --ok-soft:#E4F4EA; --warn:#B45309; --warn-soft:#FEF3E0; --bad:#D0443A; --bad-soft:#FCE9E7;
  --surface:#FFFFFF; --surface-2:#F1F7F3;
  --f:'Sarabun','Noto Sans Thai',system-ui,-apple-system,sans-serif; --fd:var(--f);
  --r:18px; --sh:0 4px 20px rgba(20,40,28,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:16px/1.7 var(--f);background:radial-gradient(1100px 500px at 100% -10%,#DDF1E4 0,transparent 60%),var(--paper);min-height:100vh}
#app{min-height:100vh}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.35;margin:0;letter-spacing:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:20px} h3{font-size:17px}
h1 em{font-style:normal;color:var(--accent)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kicker,.hero-kick{font-size:14px;font-weight:600;color:var(--accent-fg)}
svg{flex:none}

/* โครงหน้า: แถบเมนูซ้าย + เนื้อหา */
.shell{display:block;min-height:100vh}
.side{display:none}
.shell-main{min-width:0;padding:0 16px 110px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 0;margin:0 -16px 6px;padding-inline:16px;background:rgba(244,248,245,.9);backdrop-filter:blur(8px)}
.tb-brand{display:flex;align-items:center;gap:8px}
.tb-brand svg{width:32px;height:32px}
.tb-brand b{font-size:18px}
.tb-hello{display:none;flex-direction:column;line-height:1.3}
.tb-hello span{font-size:13px;color:var(--muted)} .tb-hello b{font-size:17px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-who{display:flex;align-items:center;gap:10px}
.tb-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-d);border:2px solid #fff;box-shadow:0 2px 6px rgba(20,40,28,.12)}
.tb-wt{display:none;flex-direction:column;line-height:1.25}
.tb-wt b{font-size:14px} .tb-wt span{font-size:12px;color:var(--muted)}
.pillbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.pillbtn:hover{border-color:var(--accent);color:var(--accent-d)}
.pillbtn span{display:none}
.page{max-width:1280px;margin:0 auto;padding-top:8px}
.boot{min-height:100vh;display:grid;place-items:center;align-content:center;gap:10px;text-align:center}

/* แถบล่างบนมือถือ (ผู้สอน) */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--rule);border-radius:20px;box-shadow:0 8px 28px rgba(20,40,28,.14);padding:6px}
.tab{border:0;background:transparent;padding:6px 4px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-d)}
.tab:disabled{opacity:.4}

@media (min-width:600px){ .pillbtn span{display:inline} .tb-wt{display:flex} }
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--rule);padding:26px 18px;overflow:hidden}
  .side-logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:30px;text-align:center}
  .side-logo svg{width:76px;height:76px;filter:drop-shadow(0 8px 14px rgba(22,160,90,.25))}
  .side-logo b{font-size:20px} .side-logo span{font-size:13px;color:var(--muted)}
  .side-nav{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
  .snav{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 16px;border-radius:16px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  .snav svg{color:#3B4A42}
  .snav:hover{background:var(--surface-2)}
  .snav.on{background:linear-gradient(135deg,#1FB06A,var(--accent-d));color:#fff;box-shadow:0 8px 18px rgba(22,160,90,.3)}
  .snav.on svg{color:#fff}
  .snav:disabled{opacity:.45}
  .snav-gap{height:14px}
  .side .leaf{position:absolute;left:-10px;bottom:-10px;width:190px;height:190px}
  .shell-main{padding:0 28px 40px}
  .topbar{margin:0 -28px 10px;padding:16px 28px}
  .tb-brand{display:none}
  .tb-hello{display:flex}
  .tabbar{display:none}
}
.side .leaf{pointer-events:none}

/* ปุ่มและฟอร์ม */
.btn{border:1.5px solid var(--accent-d);background:var(--accent-d);color:#fff;padding:0 22px;min-height:48px;border-radius:999px;cursor:pointer;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s,box-shadow .15s}
.btn:hover{background:#0B6A3A;border-color:#0B6A3A}
.btn.accent{background:linear-gradient(135deg,#1FB06A,var(--accent-d));border-color:var(--accent-d);box-shadow:0 6px 16px rgba(22,160,90,.25)}
.btn.accent:hover{background:var(--accent-d)}
.btn.ghost{background:#fff;color:var(--accent-d);border-color:var(--accent-d)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost:disabled{background:#fff;color:var(--accent-d)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:var(--accent);color:var(--accent-d)}
.linkarrow{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent-d);font-weight:600;cursor:pointer;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:600;color:var(--ink)}
input[type=text],input[type=number],input[type=password],input:not([type]),textarea,select{width:100%;background:#fff;border:1.5px solid var(--rule-2);border-radius:14px;padding:10px 14px;min-width:0;min-height:48px;font-size:17px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(22,160,90,.15)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.check{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:#fff}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.check b{display:block;font-weight:600}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 180px}
.hint{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.notice{padding:12px 16px;border-radius:14px;border:1px solid #F6D59A;background:var(--warn-soft);color:#7A4A06}
.notice.bad{border-color:#F2B8B2;background:var(--bad-soft);color:#8A2019}
.notice.ok{border-color:#A9D9BC;background:var(--ok-soft);color:var(--accent-d)}
.card{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.empty{padding:30px 20px;color:var(--muted);text-align:center}
.state{font-size:13px;font-weight:600;white-space:nowrap;padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.state.doing{color:#1D6FD8;background:#E6F0FD}
.state.away{color:var(--warn);background:var(--warn-soft)}
.state.done{color:var(--accent-d);background:var(--accent-soft)}
.state.bad{color:var(--bad);background:var(--bad-soft)}
.state.plain{color:var(--muted)}
.tag{font-size:13px;font-weight:600;color:var(--accent-d);background:var(--accent-soft);padding:3px 10px;border-radius:999px}

/* แบนเนอร์หลัก */
.hero{position:relative;overflow:hidden;display:grid;gap:10px;align-items:center;background:linear-gradient(115deg,#E9F6FF 0%,#E8F7EE 45%,#D8F0E0 100%);border-radius:24px;padding:24px 20px 0;margin-bottom:18px;box-shadow:var(--sh);border:1px solid #DCEFE3}
.hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:32px;line-height:1.25;font-style:italic}
.hero h1 em{background:linear-gradient(90deg,#16A05A,#38C172);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-h2{font-size:19px;font-weight:700;font-style:italic}
.hero-sub{color:var(--muted);font-size:15px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.hero-art{width:100%;max-width:460px;height:auto;justify-self:center;display:block}
.hero-split .formcard{display:grid;gap:14px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:20px;margin:10px 0 20px;box-shadow:var(--sh)}
@media (min-width:800px){
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:34px 36px 0}
  .hero-txt{padding-bottom:34px}
  .hero h1{font-size:44px}
  .hero-h2{font-size:24px}
  .hero-art{align-self:end}
  .hero-split{align-items:center}
  .hero-split .hero-art{align-self:center;padding-bottom:20px}
}

/* การ์ดสถิติ */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
.stat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat-ic svg{width:26px;height:26px}
@media (max-width:520px){.stat{padding:12px;gap:10px}.stat-ic{width:42px;height:42px}.stat-ic svg{width:21px;height:21px}.stat b{font-size:22px}}
.stat-ic.g{background:#DDF3E5;color:#16A05A}.stat-ic.b{background:#E2EEFD;color:#3B82F6}.stat-ic.o{background:#FEF0D5;color:#E9A21B}.stat-ic.p{background:#EFE6FD;color:#8B5CF6}

/* หัวข้อส่วน */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.sechead h2{font-size:22px;padding-left:14px;border-left:5px solid var(--accent);line-height:1.2}

/* การ์ดข้อสอบแบบคอร์ส */
.cgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ccard{background:#fff;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0;transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,40,28,.1)}
.ccover{position:relative;height:130px;overflow:hidden}
.ccover svg{width:100%;height:100%;display:block}
.ccover.t1{background:linear-gradient(135deg,#0E2C55,#1B4F8F)}
.ccover.t2{background:linear-gradient(135deg,#DCEBFA,#B8D5F2)}
.ccover.t3{background:linear-gradient(135deg,#A9D88F,#4F9A54)}
.cbadge{position:absolute;top:10px;left:10px;z-index:1;font-size:13px;font-weight:700;padding:2px 12px;border-radius:999px;background:#D9F7E3;color:#0E7C45}
.ccover.t2 .cbadge{background:#DDEBFF;color:#1D5FC4}
.ccover.t3 .cbadge{background:#EDE3FF;color:#6D3FD6}
.cbadge.off{background:#EEF1EF;color:#5E6F66}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:17px;text-wrap:pretty}
.cmeta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.cprog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.pbar{flex:1;height:7px;background:#E4ECE7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#1FB06A,#16A05A);border-radius:99px}
.cstate{font-size:13px;color:var(--muted);margin-bottom:auto}
.cacts{display:flex;flex-wrap:wrap;gap:6px}
.cacts .btn{flex:1 1 auto}

/* สองคอลัมน์หน้าผู้สอน */
.twocol{display:grid;gap:20px}
.rcol{display:flex;flex-direction:column;gap:16px}
@media (min-width:1200px){.twocol{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{display:flex;align-items:center;gap:10px;font-size:17px}
.card-h svg{color:var(--accent)}
.sched{display:flex;gap:14px;padding:12px;border-radius:14px;background:var(--surface-2);margin-top:8px}
.sched-d{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:6px 12px;line-height:1.2;min-width:64px}
.sched-d span{font-size:12px;color:var(--muted)} .sched-d b{font-size:20px}
.sched-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.sched-t b{font-size:15px;overflow-wrap:anywhere} .sched-t span{font-size:13px;color:var(--muted)}
.sched-t .btn{align-self:flex-start;margin-top:4px}
.donutcard{background:linear-gradient(160deg,#fff,#EAF7EF)}
.donutrow{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:120px;height:120px;flex:none}
.donut svg{width:100%;height:100%}
.donut b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.donutrow p{margin:4px 0 10px}

/* ห้องรอ */
.lobby{max-width:560px;margin:10px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 24px}
.lobby h1{font-size:28px}
.lobby-dot{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:6px;position:relative}
.lobby-dot i{width:22px;height:22px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.lobby-dot.go{background:linear-gradient(135deg,#1FB06A,var(--accent-d));color:#fff}
.lobby-dot.go svg{width:34px;height:34px}
@keyframes pulse{0%,100%{transform:scale(.8);box-shadow:0 0 0 0 rgba(22,160,90,.45)}50%{transform:scale(1);box-shadow:0 0 0 18px rgba(22,160,90,0)}}
@media (prefers-reduced-motion:reduce){.lobby-dot i{animation:none}}
.lobby-info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0}
.lobby-info span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:14px}
.lobby-info svg{width:16px;height:16px;color:var(--accent)}
.lobby .btn.block{max-width:360px}

/* intro */
.intro{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:30px 20px;background:linear-gradient(160deg,#EAF6FF,#E8F7EE 50%,#D5EEDD)}
.intro-in{position:relative;z-index:1;width:100%;max-width:520px;display:grid;justify-items:center;text-align:center;gap:12px}
.intro-in>svg:first-child{width:70px;height:70px;filter:drop-shadow(0 8px 14px rgba(22,160,90,.25))}
.intro-kicker{font-size:14px;font-weight:600;color:var(--accent-d)}
.intro-h{font-size:30px;line-height:1.35;font-style:italic}
.intro-h em{font-style:italic;color:var(--accent)}
.intro .hero-art{max-width:380px}
.intro .leaf{position:absolute;left:-20px;bottom:-20px;width:220px;height:220px}
.ringwrap{position:relative;width:110px;height:110px}
.ring{width:110px;height:110px;transform:rotate(-90deg);display:block}
.ring .track{fill:none;stroke:#D3EADB;stroke-width:8}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:339.292;transition:stroke-dashoffset .95s linear}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.intro-sub{font-size:14px;color:var(--muted)}

/* หน้าผู้สอน: หัวเรื่อง ผลสด ตาราง ตัวแก้ไข */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin:6px 0 18px}
.head p{margin-top:6px;color:var(--muted)}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.toolbar .field{flex:1 1 240px;max-width:520px}
.sumrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (min-width:760px){.sumrow{grid-template-columns:repeat(6,minmax(0,1fr))}}
.sum{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;box-shadow:var(--sh)}
.sum b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent-d)}
.sum span{font-size:13px;color:var(--muted)}
.tablewrap{background:#fff;border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;padding:4px 16px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:12px 10px 12px 0;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:15px}
.tbl th{font-size:13px;color:var(--muted);font-weight:600}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.sel{background:var(--accent-soft)}
@media (max-width:759px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:16px 0;border-bottom:1px solid var(--rule)}
  .tbl td{display:flex;flex-direction:column;border:0;padding:0;white-space:normal;font-size:15px;align-items:flex-start}
  .tbl td::before{content:attr(data-label);font-size:12px;color:var(--muted)}
  .tbl td.wide{grid-column:1/-1}
  .tbl td.wide .linkbtn{font-size:18px}
}
.detail{margin-top:20px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:20px;box-shadow:var(--sh);display:grid;gap:18px}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.dgrid{display:grid;gap:22px}
@media (min-width:860px){.dgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.tl{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
.tl li{display:flex;gap:14px;padding:10px 12px;font-size:15px;border-radius:12px;align-items:flex-start}
.tl li:nth-child(odd){background:var(--surface-2)}
.tl time{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;min-width:60px;font-size:14px}
.tl li.w{color:var(--warn)}
.tl li.w time{color:inherit}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.sq{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;border:1px solid var(--rule-2);color:var(--muted);font-variant-numeric:tabular-nums;background:#fff}
.sq.r{background:var(--ok);border-color:var(--ok);color:#fff}
.sq.w{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid var(--rule-2)}
.qcard2{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--sh);display:grid;gap:12px}
.qhead2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qhead2 .btns{display:flex;gap:6px;flex-wrap:wrap}
.crow{display:flex;gap:10px;align-items:center}
.crow input[type=radio]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.crow .lt{flex:none;width:26px;font-weight:700;color:var(--muted)}
.ptsbox{width:110px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;padding:12px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 8px 24px rgba(20,40,28,.12)}
@media (min-width:1000px){.savebar{bottom:16px}}
.sec-title{font-size:15px;font-weight:700;color:var(--accent-d);margin:10px 0 0}
.exlist2,.exrow,.exinfo,.exmeta,.exact{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;padding:12px 18px;font-weight:600;max-width:520px;margin:0 auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media (min-width:1000px){#toast{bottom:24px}}
.veil{position:fixed;inset:0;z-index:40;background:rgba(20,40,28,.55);display:grid;place-items:center;padding:24px}
.veil .panel{background:#fff;max-width:400px;padding:26px;display:flex;flex-direction:column;gap:14px;border-radius:20px}
.noselect{user-select:none;-webkit-user-select:none}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<style>
.linkbtn.small{font-size:13px;font-weight:600;text-decoration-color:var(--muted);white-space:nowrap}

/* ===== หน้าทำข้อสอบ (โทนเขียวสว่าง) ===== */
body:has(.xm){background:#F2F7F4;padding:0}
#app:has(.xm){max-width:none}
.xm{--g:#16A05A;--gd:#0E7C45;--gs:#E4F4EA;--gs2:#F1FAF4;--xi:#13281D;--xm:#5E6F66;--xb:#E2EBE5;--xo:#F59E0B;--xos:#FEF3E0;--xr:#D9483B;
  min-height:100vh;color:var(--xi);font-family:var(--f);color-scheme:light;
  background:radial-gradient(1200px 400px at 100% 0,#DDF2E5 0,transparent 60%),radial-gradient(800px 500px at 0 100%,#E3F5EA 0,transparent 55%),#F2F7F4;
  padding:0 0 32px}
.xm *{box-sizing:border-box}
.xm button{font-family:inherit}
.xm-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--xb)}
.xm-top-in{max-width:1320px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.xm-brand{display:flex;align-items:center;gap:12px;min-width:0}
.xm-brand svg{flex:none}
.xm-sep{width:1.5px;height:30px;background:var(--xi);opacity:.7;flex:none}
.xm-tt{display:flex;flex-direction:column;min-width:0}
.xm-tt b{font-size:18px;font-weight:600;line-height:1.2}
.xm-tt span{font-size:13px;color:var(--xm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xm-who{display:flex;align-items:center;gap:10px;flex:none}
.xm-avatar{width:40px;height:40px;border-radius:50%;background:var(--gs);color:var(--gd);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(19,40,29,.12)}
.xm-whot{display:none;flex-direction:column;line-height:1.25}
.xm-whot b{font-size:14px}.xm-whot span{font-size:12px;color:var(--xm)}
.xm-tchip{display:inline-flex;align-items:center;gap:6px;background:var(--gs);color:var(--gd);font-weight:700;font-variant-numeric:tabular-nums;padding:7px 12px;border-radius:999px;font-size:16px}
.xm-tchip .low,.xm-clock.low{color:var(--xr)}
.xm-grid{max-width:1320px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.xm-left{display:none}
.xm-main,.xm-right{display:flex;flex-direction:column;gap:16px;min-width:0}
.xm-card{background:#fff;border:1px solid var(--xb);border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(19,40,29,.05)}
.xm-pill{display:inline-flex;align-items:center;gap:10px;background:var(--gs);color:var(--xi);font-weight:600;font-size:16px;padding:9px 16px;border-radius:12px}
.xm-pill svg{color:var(--gd)}
.xm-pill.soft{background:var(--gs2);width:100%;font-size:18px}
.xm-h3{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;margin:0 0 14px}
.xm-h3 svg{color:var(--g)}
.xm-muted{color:var(--xm);font-size:15px;margin:0}
.xm-qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.xm-flag{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--xi);font-size:15px;font-weight:500;cursor:pointer;padding:8px 6px;border-radius:10px}
.xm-flag:hover{background:var(--gs2)}
.xm-flag.on{color:#B45309}.xm-flag.on svg{fill:var(--xo);stroke:var(--xo)}
.xm-qtext{font-size:21px;font-weight:600;line-height:1.55;margin:0 0 18px;color:var(--xi);white-space:pre-wrap}
.xm-opts{display:flex;flex-direction:column;gap:12px}
.xm-opt{position:relative;display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border:1.5px solid var(--xb);border-radius:14px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s;min-height:56px}
.xm-opt:hover{border-color:#A9D9BC;background:var(--gs2)}
.xm-opt input{position:absolute;opacity:0;pointer-events:none}
.xm-opt:has(input:focus-visible){outline:3px solid var(--g);outline-offset:2px}
.xm-radio{width:24px;height:24px;border-radius:50%;border:2px solid #9AA8A0;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.xm-let{font-weight:600;flex:none;min-width:22px;font-size:17px}
.xm-otext{font-size:17px;line-height:1.5}
.xm-opt.on{border-color:var(--g);background:var(--gs);box-shadow:0 0 0 1px var(--g) inset}
.xm-opt.on .xm-radio{border-color:var(--g)}
.xm-opt.on .xm-radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.xm-navbar{display:flex;justify-content:space-between;gap:12px;padding:12px;position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:10}
.xm-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1.5px solid var(--gd);background:var(--gd);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
.xm-btn:hover{background:#0B6A3A}
.xm-btn:active{transform:translateY(1px)}
.xm-btn.ghost{background:#fff;color:var(--gd)}
.xm-btn.ghost:hover{background:var(--gs2)}
.xm-btn:disabled{opacity:.45;cursor:not-allowed}
.xm-btn.block{width:100%}
.xm-btn.sm{min-height:40px;padding:0 16px;font-size:15px}
.xm-navbar .xm-btn{flex:1 1 0;padding:0 14px}
.xm-nums{display:grid;gap:10px;margin:16px 0}
.xm-nums.c3{grid-template-columns:repeat(3,1fr)}
.xm-nums.c5{grid-template-columns:repeat(5,1fr)}
.xn{aspect-ratio:1;max-width:56px;width:100%;justify-self:center;border-radius:14px;border:1px solid var(--xb);background:#fff;font-size:18px;font-weight:600;color:var(--xi);cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(19,40,29,.06);padding:0}
.xm-nums.c5 .xn{border-radius:50%;max-width:48px;font-size:17px}
.xm-nums.big .xn{max-width:60px}
.xn:hover{border-color:var(--g)}
.xn.ans{background:var(--gs);border-color:#9FD7B5;color:var(--gd)}
.xn.flag{background:var(--xos);border-color:#F8C878;color:#B45309}
.xn.cur{background:linear-gradient(160deg,#1FB06A,var(--gd));border-color:var(--gd);color:#fff}
.xm-legend{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px;font-size:15px}
.xm-legend li{display:flex;align-items:center;gap:10px}
.xm-legend i{width:18px;height:18px;border-radius:50%;background:#8E99A0}
.xm-legend i.ok{background:#3CC37A}.xm-legend i.fl{background:var(--xo)}
.xm-time{background:linear-gradient(180deg,#fff,var(--gs2))}
.xm-clock{margin:14px 0 12px;background:var(--gs2);border-radius:14px;text-align:center;font-size:44px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:8px 0;color:var(--xi)}
.xm-tbar{height:9px;border-radius:99px;background:#DCE4DF;overflow:hidden}
.xm-tbar i{display:block;height:100%;width:100%;background:var(--g);border-radius:99px;transition:width 1s linear}
.xm-tbar i.low{background:var(--xr)}
.xm-count{text-align:center;margin-top:18px;display:flex;flex-direction:column;gap:4px}
.xm-count span{font-size:15px;color:var(--xi)}
.xm-count b{font-size:32px;font-variant-numeric:tabular-nums}
.xm-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--xm);margin:12px 0 4px}
.xm-notice{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--xos);border:1px solid #F6D59A;color:#7A4A06;border-radius:14px;padding:12px 16px;font-size:15px}
.xm-done{max-width:520px;margin:0 auto;padding:24px 16px}
.xm-check{width:64px;height:64px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin:4px auto 0;box-shadow:0 8px 20px rgba(22,160,90,.3)}
.xm-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--xb);font-size:16px}
.xm-row span{color:var(--xm)}
.xm-row:last-of-type{border-bottom:1px solid var(--xb)}
@media (min-width:760px){
  .xm-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start;padding:20px}
  .xm-right{position:sticky;top:84px}
  .xm-tchip{display:none}
  .xm-whot{display:flex}
  .xm-navbar{position:static}
  .xm-navbar .xm-btn{flex:0 0 auto;min-width:200px}
  .xm-card{padding:24px}
  .xm-qtext{font-size:24px}
}
@media (min-width:1100px){
  .xm-grid{grid-template-columns:230px minmax(0,1fr) 310px}
  .xm-left{display:block;position:sticky;top:84px}
}
@media (max-width:420px){
  .xm-tt b{font-size:16px}
  .xm-brand svg{width:28px;height:28px}
  .xm-avatar{display:none}
  .xm-btn{font-size:16px}
}
</style>
<script src="app.js?v=20261115a"></script>
</body>
</html>
